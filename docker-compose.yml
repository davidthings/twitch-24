services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: twitch24_dev
    ports:
      - "5432:5432"
    volumes:
      - twitch24_pgdata:/var/lib/postgresql/data

volumes:
  twitch24_pgdata:
